name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true
      - name: Build (linux amd64)
        run: |
          mkdir -p dist
          GOOS=linux GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/Think-iT-Labs/dirhash/cmd.version=${{ github.ref_name }}'" -o dist/dirhash-linux-amd64
      - name: Build (windows amd64)
        run: |
          GOOS=windows GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/Think-iT-Labs/dirhash/cmd.version=${{ github.ref_name }}'" -o dist/dirhash-windows-amd64.exe
      - name: Build (darwin amd64)
        run: |
          GOOS=darwin GOARCH=amd64 go build -ldflags "-s -w -X 'github.com/Think-iT-Labs/dirhash/cmd.version=${{ github.ref_name }}'" -o dist/dirhash-darwin-amd64
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dirhash-binaries
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: dirhash-binaries
          path: dist
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            dist/dirhash-linux-amd64
            dist/dirhash-windows-amd64.exe
            dist/dirhash-darwin-amd64
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

